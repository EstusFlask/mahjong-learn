<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日麻 — 人机对战</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="nav-links">
    <a href="/" class="active">人机对战</a>
    <a href="/ai_battle">4 AI 对战</a>
    <a href="/replay">牌谱复现</a>
</nav>

<!-- Landing Overlay -->
<div class="landing-overlay" id="landingOverlay">
    <div class="landing-card">
        <h1>日麻</h1>
        <p class="subtitle">4人立直麻将 · 人机对战</p>

        <div class="landing-options">
            <label class="option-row">
                <span>赛制</span>
                <select id="maxRoundSelect">
                    <option value="0">东风战</option>
                    <option value="1" selected>半庄</option>
                </select>
            </label>
            <label class="option-row">
                <span>P1 (下家)</span>
                <select id="aiModelP1" class="ai-model-select"></select>
            </label>
            <label class="option-row">
                <span>P2 (对家)</span>
                <select id="aiModelP2" class="ai-model-select"></select>
            </label>
            <label class="option-row">
                <span>P3 (上家)</span>
                <select id="aiModelP3" class="ai-model-select"></select>
            </label>
            <label class="option-row">
                <span>随机种子</span>
                <input type="number" id="seedInput" placeholder="留空 = 随机">
            </label>
        </div>

        <button class="action-btn btn-confirm landing-start-btn" onclick="startHumanAI()">开始游戏</button>
    </div>
</div>

<div class="top-bar" id="topBar" style="display:none">
    <div class="table-meta">
        <span class="round-info">东1局</span>
        <span class="honba">本场 0</span>
        <span class="riichibo">供托 0</span>
        <span class="tiles-left">牌山 70</span>
    </div>
    <div class="dora-bar">
        <span>宝牌:</span>
        <span class="dora-tiles" id="doraTiles"></span>
    </div>
    <div class="advice-bar">
        <label class="advice-toggle" for="adviceToggle">
            <input type="checkbox" id="adviceToggle" checked>
            <span>显示建议</span>
        </label>
    </div>
</div>

<div class="advice-dashboard" id="adviceDashboard" aria-live="polite" hidden>
    <section class="advice-card advice-primary-card">
        <header class="advice-card-header">
            <h2>BOT ACTION</h2>
        </header>
        <div class="advice-primary-content">
            <span class="advice-primary-tile" id="advicePrimaryTile"></span>
            <div class="advice-primary-copy">
                <div class="advice-primary-label" id="advicePrimaryLabel"></div>
                <div class="advice-primary-meta" id="advicePrimaryMeta"></div>
            </div>
        </div>
    </section>
    <section class="advice-card advice-ranking-card">
        <header class="advice-card-header">
            <h2>TOP 3</h2>
            <span class="advice-probability-note"
                title="由合法动作的 Q 值 softmax 得到相对偏好，不是校准后的胜率；无 Q 值时显示 —">相对概率</span>
        </header>
        <ol class="advice-top-actions" id="adviceTopActions"></ol>
    </section>
</div>

<div class="game-container" id="gameContainer" style="display:none">
    <div class="game-main">
        <canvas id="mahjongCanvas" width="1200" height="780"></canvas>
        <div class="status-msg" id="statusMsg">准备中...</div>
        <div class="action-panel" id="actionPanel"></div>
    </div>

    <aside class="side-panel">
        <div class="panel-card">
            <h3>累计点数</h3>
            <div class="scoreboard" id="scoreboard"></div>
        </div>
        <div class="panel-card">
            <h3>半庄进度</h3>
            <div class="hansou-stepper" id="hansouStepper"></div>
        </div>
        <div class="panel-card">
            <h3>对局日志</h3>
            <div id="logContent" style="max-height:240px; overflow-y:auto; font-size:12px"></div>
        </div>
    </aside>
</div>

<script src="/static/js/renderer.js"></script>
<script src="/static/js/game_core.js"></script>
<script>
    let game = null;
    let _availableModels = null;

    async function _populateAiSelects(selects, includeRandom = true) {
        if (_availableModels === null) {
            try {
                const r = await fetch('/api/models');
                const j = await r.json();
                _availableModels = j.models || [];
            } catch (e) {
                console.warn('failed to list models:', e);
                _availableModels = [];
            }
        }
        for (const sel of selects) {
            sel.innerHTML = '';
            if (includeRandom) {
                const opt = document.createElement('option');
                opt.value = 'random';
                opt.textContent = '随机 AI（默认）';
                sel.appendChild(opt);
            }
            for (const m of _availableModels) {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = `${m.name}${m.is_mortal ? ' · Mortal V4' : ''}`;
                sel.appendChild(opt);
            }
            const defaultModel = _availableModels.find(m => m.is_default);
            if (defaultModel) sel.value = defaultModel.name;
        }
        const adviceToggle = document.getElementById('adviceToggle');
        if (adviceToggle) adviceToggle.disabled = !_availableModels.some(m => m.is_mortal);
    }

    function _buildAiModelsArray() {
        // human at seat 0; AI at seats 1/2/3.
        return [
            null,
            document.getElementById('aiModelP1').value,
            document.getElementById('aiModelP2').value,
            document.getElementById('aiModelP3').value,
        ];
    }

    function startHumanAI() {
        const aiModels = _buildAiModelsArray();
        const seedVal = document.getElementById('seedInput').value;
        const seed = seedVal ? parseInt(seedVal) : null;
        const maxRound = parseInt(document.getElementById('maxRoundSelect').value);

        // Show game UI, hide landing
        document.getElementById('landingOverlay').style.display = 'none';
        document.getElementById('topBar').style.display = '';
        document.getElementById('gameContainer').style.display = '';

        // Destroy previous game if any
        if (game) {
            game.destroy();
            game = null;
        }

        game = new MahjongGame('mahjongCanvas');
        game.setAdviceEnabled(document.getElementById('adviceToggle').checked);
        game.resize();

        // Remove old click listeners by replacing canvas
        const oldCanvas = game.canvas;
        const newCanvas = oldCanvas.cloneNode(true);
        oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);
        game.canvas = newCanvas;
        game.ctx = newCanvas.getContext('2d');
        newCanvas.addEventListener('click', (e) => game._onCanvasClick(e));

        window.addEventListener('resize', () => {
            if (game) {
                game.resize();
                game._render();
            }
        });

        game.newGame('human_ai', null, seed, maxRound, aiModels).catch(err => {
            alert('启动失败: ' + err.message);
        });
    }

    function showLanding() {
        if (game) {
            game.destroy();
            game = null;
        }
        document.getElementById('landingOverlay').style.display = '';
        document.getElementById('topBar').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'none';
    }

    // Override _onGameOver to show restart button
    const _origOnGameOver = MahjongGame.prototype._onGameOver;
    MahjongGame.prototype._onGameOver = function(state, data) {
        _origOnGameOver.call(this, state, data);
        const panel = document.getElementById('actionPanel');
        if (panel) {
            const btn = document.createElement('button');
            btn.className = 'action-btn btn-confirm';
            btn.textContent = '返回主页';
            btn.onclick = showLanding;
            panel.appendChild(btn);
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        const sels = [
            document.getElementById('aiModelP1'),
            document.getElementById('aiModelP2'),
            document.getElementById('aiModelP3'),
        ].filter(Boolean);
        _populateAiSelects(sels);
        document.getElementById('adviceToggle').addEventListener('change', (e) => {
            if (game) game.setAdviceEnabled(e.target.checked);
        });
    });
</script>
</body>
</html>
